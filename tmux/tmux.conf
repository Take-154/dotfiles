
# ========================================
# ターミナル
# ========================================

set -g default-terminal "tmux-256color"

# True Color (tmux 3.2以降)
set -as terminal-features ",xterm-256color:RGB,tmux-256color:RGB"

set -s escape-time 0

# ペイン番号を1から開始
# set -g pane-base-index 1

# ウィンドウ番号を1から開始
# set -g base-index 1

# ウィンドウを閉じたときに番号を詰める
set -g renumber-windows on

# ========================================
# 操作
# ========================================

set -g mode-keys vi
set -g mouse on

# ホイールでコピーモードに入る（自動終了しない）
bind -T root WheelUpPane \
    if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' \
    'send-keys -M' 'copy-mode'

# コピーモード中のホイール操作
bind -T copy-mode-vi WheelDownPane \
    select-pane \; send-keys -X -N 5 scroll-down

# Ctrl + 左ドラッグで矩形選択
bind -n C-MouseDrag1Pane \
    copy-mode -M \; send-keys -X rectangle-toggle

bind -T copy-mode-vi C-MouseDrag1Pane \
    select-pane \; \
    send-keys -X rectangle-toggle \; \
    send-keys -X begin-selection

# Ctrl + 左ドラッグを離したらコピーして終了
bind -T copy-mode-vi C-MouseDragEnd1Pane \
    send-keys -X copy-pipe-and-cancel

# Alt + 矢印キーでペイン移動
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# ペインの端に達したら隣のウィンドウへ移動
bind -n M-Left  if-shell -F '#{pane_at_left}'   'previous-window' 'select-pane -L'
bind -n M-Right if-shell -F '#{pane_at_right}'  'next-window'     'select-pane -R'

# ========================================
# ステータスバー
# ========================================

# Pure Like Minimal
set -g status-style "fg=color242,bg=terminal"

# セッション1個なら»，複数なら»セッション名
set -g status-left '#{?#{==:#{S:1},1},» ,#[fg=blue]» #S #[fg=default]}'
# セッションが2個以上あるときクリックで次へ切り替え
bind -n MouseDown1StatusLeft \
    if-shell 'test "$(tmux list-sessions | wc -l)" -gt 1' \
    'switch-client -n'

set -g status-right ""
set -g status-interval 10
set -g window-status-separator ""
set -g window-status-format "  #I:#W "
set -g window-status-current-format "› #I:#W "
set -g window-status-style "fg=color242,bg=default"
set -g window-status-current-style "fg=magenta,bg=default"

# ========================================
# ペイン
# ========================================

# ペイン背景はデフォルト
set -g window-style "fg=default,bg=default"
set -g window-active-style "fg=default,bg=default"

# 境界線を強調
set -g pane-border-style "fg=color242,bg=default"
set -g pane-active-border-style "fg=magenta,bg=default"

# 非アクティブ
set -g window-style "fg=gray,bg=terminal"

# アクティブ
set -g window-active-style "fg=terminal,bg=terminal"

# ========================================
# メッセージ・コピーモード
# ========================================

set -g message-style "fg=yellow,bg=default"
set -g display-time 1250
set -g mode-style "fg=color242,bg=gainsboro"

# ========================================
# 環境固有の設定
# ========================================

source-file -q ~/.config/tmux/local.conf

