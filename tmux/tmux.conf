set-window-option -g mode-keys vi
set -g mouse on
set -g terminal-overrides 'xterm*:smcup@:rmcup@'

bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

set -g default-terminal 'tmux-256color'
set -ga terminal-overrides ',xterm-256color:RGB'
set -ga terminal-overrides ',tmux-256color:RGB'

set -g status-fg 'silver'
set -g status-bg 'darkmagenta'
set -g status-position bottom
set -g status-interval 1

set -g window-status-format " #I:#W"
set -g window-status-current-style "fg=darkmagenta,bg=silver"
set -g window-status-current-format "❯ #I:#W"

set -g status-left " [#S] "
set -g status-right "%Y/%m/%d %H:%M "

set -g pane-border-style 'fg=silver,bg=#262026'
set -g pane-active-border-style 'fg=darkmagenta,bg=black'

set -g message-style "fg=silver,bg=darkmagenta"

set -g mode-style "fg=black,bg=white"

# set -g copy-mode-match-style "fg=black,bg=white"
# set -g copy-mode-current-match-style "fg=black,bg=white"

set -s escape-time 0

set -g window-style 'fg=default, bg=#262026'
set -g window-active-style 'fg=default, bg=black'

# native Wayloand
if-shell '[ env | grep -q WAYLAND_DISPLAY ] && ! grep -qi microsoft /proc/version' \
  "source-file ~/.dotfiles/tmux/wayland.conf"
# native X11
if-shell '[ -n "$DISPLAY" ] && [ -z "$WAYLAND_DISPLAY" ] && ! grep -qi microsoft /proc/version' \
  "source-file ~/.dotfiles/tmux/X11.conf"
